# ---------------------------------------------------------------------------
# STAGE: push — Build & push to Google Artifact Registry
#
# ⚠️  Pre-create the GAR repository once:
#   gcloud artifacts repositories create $GAR_REPO_NAME \
#     --repository-format=docker \
#     --location=$GCP_REGION \
#     --project=$GCP_PROJECT_ID
#
# Image URL: GCP_REGION-docker.pkg.dev/GCP_PROJECT_ID/GAR_REPO_NAME/GAR_IMAGE_NAME:TAG
# ---------------------------------------------------------------------------
push-to-gar:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/usr/local
    - export PATH="/usr/local/google-cloud-sdk/bin:$PATH"
    - *gcp-auth
  script:
    - |
      GAR_URL="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_NAME}/${GAR_IMAGE_NAME}"

      docker build -t webapp:latest .
      docker tag webapp:latest "${GAR_URL}:latest"
      docker tag webapp:latest "${GAR_URL}:${CI_COMMIT_SHORT_SHA}"
      docker push "${GAR_URL}:latest"
      docker push "${GAR_URL}:${CI_COMMIT_SHORT_SHA}"

      echo "GAR_URL=${GAR_URL}" >> build.env
      echo "IMAGE_TAG=${CI_COMMIT_SHORT_SHA}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main

# ---------------------------------------------------------------------------
# STAGE: deploy — Deploy to GKE via kubectl
#
# ⚠️  Pre-requisites:
#   1. GKE cluster already exists:
#      gcloud container clusters create $GKE_CLUSTER_NAME \
#        --zone $GKE_CLUSTER_ZONE --project $GCP_PROJECT_ID
#   2. GKE nodes service account has roles/artifactregistry.reader
#   3. The SA in GCP_SA_KEY has roles/container.developer
# ---------------------------------------------------------------------------
deploy-to-gke:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp-auth
    - gcloud components install kubectl --quiet
    # Get GKE credentials into ~/.kube/config
    - gcloud container clusters get-credentials "$GKE_CLUSTER_NAME"
        --zone "$GKE_CLUSTER_ZONE"
        --project "$GCP_PROJECT_ID"
  script:
    - |
      GAR_URL="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO_NAME}/${GAR_IMAGE_NAME}"

      # Substitute image path and tag placeholders in deployment.yaml
      sed -i "s|GCP_REGION-docker.pkg.dev/GCP_PROJECT_ID/GAR_REPO_NAME/GAR_IMAGE_NAME|${GAR_URL}|g" deployment.yaml
      sed -i "s|docker_tag|${CI_COMMIT_SHORT_SHA}|g" deployment.yaml

      kubectl delete -f deployment.yaml --ignore-not-found=true
      kubectl apply  -f deployment.yaml

      echo "Waiting for rollout to complete..."
      kubectl rollout status deployment/devops-training --timeout=120s
  only:
    - main

# ---------------------------------------------------------------------------
# STAGE: upload-reports — Upload all scan artefacts to Google Cloud Storage
#
# ⚠️  Pre-create the GCS bucket:
#   gsutil mb -l $GCP_REGION gs://$GCS_BUCKET
#   Grant: roles/storage.objectAdmin to the SA
# ---------------------------------------------------------------------------
upload-reports-to-gcs:
  stage: upload-reports
  image: google/cloud-sdk:alpine
  before_script:
    - *gcp-auth
  script:
    - |
      GCS_PATH="gs://${GCS_BUCKET}/security-scans/run-${CI_PIPELINE_ID}/"

      REPORTS=(
        prisma-code-scan.json
        trufflehog-results.json
        snyk-sca.json
        snyk-sast.json
        snyk-container.json
        prisma-scan.json
        sonar-report.json
        zap-report.html
        zap-report.json
        zap-report.md
      )

      # Save pipeline metadata as log
      echo "Pipeline ID   : ${CI_PIPELINE_ID}"        > logs.txt
      echo "Pipeline URL  : ${CI_PIPELINE_URL}"       >> logs.txt
      echo "Commit SHA    : ${CI_COMMIT_SHA}"         >> logs.txt
      echo "Branch        : ${CI_COMMIT_REF_NAME}"    >> logs.txt
      echo "Project       : ${CI_PROJECT_PATH}"       >> logs.txt
      echo "Runner        : ${CI_RUNNER_DESCRIPTION}" >> logs.txt
      ls -lah >> logs.txt
      REPORTS+=("logs.txt")

      echo "Uploading reports to ${GCS_PATH}"
      for file in "${REPORTS[@]}"; do
        if [ -f "$file" ]; then
          gsutil cp "$file" "${GCS_PATH}"
          echo "Uploaded: $file"
        else
          echo "Warning: $file not found, skipping..."
        fi
      done

      echo "All available security reports uploaded to GCS."
  when: always
  only:
    - main
