# =============================================================================
# GitLab CI/CD — Build, Scan & Deploy WebApp to GKE via Google Artifact Registry
# Project: devopscicd17-SampleWebApp
#
# ⚠️  REQUIRED GOOGLE CLOUD INPUTS (Settings → CI/CD → Variables):
#
#   GCP_SA_KEY          → Base64-encoded GCP Service Account JSON key
#                         Roles needed:
#                           - roles/artifactregistry.writer
#                           - roles/storage.objectAdmin
#                           - roles/container.developer   (for GKE deploy)
#   GCP_PROJECT_ID      → GCP project ID              e.g. my-project-123456
#   GCP_REGION          → Artifact Registry region    e.g. us-central1
#   GAR_REPO_NAME       → GAR repository name         e.g. my-app-repo
#   GAR_IMAGE_NAME      → Docker image name           e.g. webapp
#   GKE_CLUSTER_NAME    → GKE cluster name            e.g. my-gke-cluster
#   GKE_CLUSTER_ZONE    → GKE cluster zone            e.g. us-central1-a
#   GCS_BUCKET          → GCS bucket for scan reports e.g. my-security-scans
#   GCE_HOST            → External IP of GKE ingress / LB (for ZAP DAST scan)
#
#   PRISMA_API_KEY      → Prisma Cloud API key (Checkov)
#   PRISMA_ACCESS_KEY   → Prisma Cloud twistcli access key
#   PRISMA_SECRET_KEY   → Prisma Cloud twistcli secret key
#   PRISMA_CONSOLE_URL  → Prisma Cloud console URL
#   SONAR_TOKEN         → SonarCloud authentication token
#   SNYK_TOKEN          → Snyk authentication token
#
# =============================================================================

stages:
  - checkout-scan    # Prisma / Checkov IaC + code scan
  - build            # Maven WAR + Docker image build
  - security-scans   # TruffleHog, SonarCloud, Snyk, Prisma twistcli, OWASP ZAP
  - push             # Push Docker image to Google Artifact Registry
  - deploy           # Deploy to GKE via kubectl
  - upload-reports   # Upload all scan reports to Google Cloud Storage

# ---------------------------------------------------------------------------
# Default image
# ---------------------------------------------------------------------------
default:
  image: google/cloud-sdk:alpine

# ---------------------------------------------------------------------------
# Reusable GCP auth anchor
# ---------------------------------------------------------------------------
.gcp-auth: &gcp-auth
  - echo "$GCP_SA_KEY" | base64 -d > /tmp/sa-key.json
  - gcloud auth activate-service-account --key-file=/tmp/sa-key.json
  - gcloud config set project "$GCP_PROJECT_ID"
  - gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

# ---------------------------------------------------------------------------
# STAGE: checkout-scan — Prisma / Checkov IaC + Code scan
# ---------------------------------------------------------------------------
prisma-code-scan:
  stage: checkout-scan
  image: python:3.11-slim
  before_script:
    - pip install --quiet checkov
  script:
    - |
      checkov -d . \
        --bc-api-key "$PRISMA_API_KEY" \
        --output json \
        --output-file-path . \
        || true
    - |
      if [ -f results_checkov.json ]; then
        mv results_checkov.json prisma-code-scan.json
      elif [ -f results.json ]; then
        mv results.json prisma-code-scan.json
      fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - prisma-code-scan.json
    expire_in: 7 days

# ---------------------------------------------------------------------------
# STAGE: build — Maven WAR build
# ---------------------------------------------------------------------------
maven-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - mvn -B clean package --file pom.xml
    - echo "Build complete — WAR at target/WebApp.war"
  artifacts:
    paths:
      - target/WebApp.war
    expire_in: 1 day

# ---------------------------------------------------------------------------
# STAGE: security-scans
# ---------------------------------------------------------------------------

# TruffleHog — Secrets scan
trufflehog-scan:
  stage: security-scans
  image: python:3.11-slim
  before_script:
    - pip install --quiet "trufflehog==2.2.1"
  script:
    - trufflehog filesystem . --json > trufflehog-results.json || echo "TruffleHog scan failed, continuing..."
  allow_failure: true
  artifacts:
    when: always
    paths:
      - trufflehog-results.json
    expire_in: 7 days

