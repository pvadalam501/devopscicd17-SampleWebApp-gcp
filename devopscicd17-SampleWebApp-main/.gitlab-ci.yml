# Prisma Cloud — twistcli container scan
prisma-container-scan:
  stage: security-scans
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - docker build -t webapp:latest .
  script:
    - |
      curl -u "${PRISMA_ACCESS_KEY}:${PRISMA_SECRET_KEY}" \
        --output twistcli \
        "${PRISMA_CONSOLE_URL}/api/v1/util/twistcli"
      chmod +x twistcli
    - |
      ./twistcli images scan \
        --address "${PRISMA_CONSOLE_URL}" \
        --user "${PRISMA_ACCESS_KEY}" \
        --password "${PRISMA_SECRET_KEY}" \
        --output-file prisma-scan.json \
        webapp:latest || echo "Prisma scan failed, continuing..."
  allow_failure: true
  artifacts:
    when: always
    paths:
      - prisma-scan.json
    expire_in: 7 days

